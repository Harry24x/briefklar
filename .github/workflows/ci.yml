name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check . ../eval
          ruff format --check . ../eval
      - name: Tests
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for frontend
        id: check
        run: echo "exists=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, lint, type check, build
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit
          npm run build

  # Small eval (10 answerable + 3 unanswerable questions) against the committed corpus fixture.
  # Runs only on main and only if the GROQ_API_KEY secret exists; fails if answer correctness
  # drops more than 10 points below the saved baseline on the same questions.
  eval:
    needs: backend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: briefklar
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: briefklar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U briefklar"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DATABASE_URL: postgresql+psycopg://briefklar:ci@localhost:5432/briefklar
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check for Groq key
        id: key
        working-directory: .
        run: echo "present=$([ -n "$GROQ_API_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.present == 'false'
        working-directory: .
        run: echo "GROQ_API_KEY secret not set - skipping the eval job."
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-python@v5
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/cache@v4
        if: steps.key.outputs.present == 'true'
        with:
          path: ~/.cache/huggingface
          key: hf-models-e5-small-mmarco-v1
      - name: Install (CPU PyTorch)
        if: steps.key.outputs.present == 'true'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,ml]"
      - name: Load corpus fixture
        if: steps.key.outputs.present == 'true'
        run: python -m app.ingest.load_fixture
      - name: Eval with quality gate
        if: steps.key.outputs.present == 'true'
        run: >
          python ../eval/run_eval.py --mode hybrid+rerank --answers --limit 10 --sleep 10
          --no-save --baseline ../eval/results/2026-11-23_hybrid-rerank_answers.json
          --max-drop 0.10
