      - /jobsuche
      - /datei/
      - /vor-ort/
    seeds:
      - { url: https://www.arbeitsagentur.de/bildung/studium/jobben-neben-dem-studium, lang: de, topic: student-work }
      - { url: https://www.arbeitsagentur.de/bildung/studium/versicherungen-im-studium, lang: de, topic: insurance }
      - { url: https://www.arbeitsagentur.de/arbeiten-in-deutschland/praktika-und-ferienjobs-fuer-auslaendische-studierende, lang: de, topic: internship }
      - { url: https://www.arbeitsagentur.de/en/working-in-germany/internships-holiday-jobs-for-students, lang: en, topic: internship }
      - { url: https://www.arbeitsagentur.de/unternehmen/fachkraefte-ausland/praktika-auslaendische-studierende, lang: de, topic: internship }
      - { url: https://www.arbeitsagentur.de/unternehmen/fachkraefte-ausland/ferienbeschaeftigung, lang: de, topic: internship }
      - { url: https://www.arbeitsagentur.de/unternehmen/arbeitskraefte/auslaendische-studierende-beschaeftigen, lang: de, topic: student-work }
      - { url: https://www.arbeitsagentur.de/arbeiten-in-deutschland/deutschkenntnisse, lang: de, topic: german-language }
      - { url: https://www.arbeitsagentur.de/en/working-in-germany, lang: en, topic: working }
      - { url: https://www.arbeitsagentur.de/en/working-in-germany/how-to-find-a-job, lang: en, topic: job-search }
      - { url: https://www.arbeitsagentur.de/en/working-in-germany/advice-and-support, lang: en, topic: job-search }

