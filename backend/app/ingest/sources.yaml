# BriefKlar seed sources (MVP: 3 official sites).
#
# How the crawler uses this file:
#   1. It fetches every seed URL below.
#   2. It also fetches the page's <link rel="alternate" hreflang="de|en"> twin, if the site has one
#      (any path on the same site, as long as it is not denied).
#   3. It follows links on a seed page ONE level deep, but only to URLs that start with one of
#      the site's `allow` prefixes and do not contain any `deny` pattern.
#   4. It stops at `max_pages` per site.
# Run `python -m app.ingest.crawl --list` to print the final URL list without storing anything.

user_agent: "BriefKlarBot/0.1 (student project; +https://github.com/Harry24x/briefklar)"
delay_seconds: 1.0        # 1 request per second, per the plan
follow_depth: 1

sites:
  # make-it-in-germany.com was the first choice, but its Radware bot protection blocks every
  # automated request (22.11.2026: 12/12 pages BLOCKED). We respect that instead of bypassing it.
  - name: study-in-germany
    base: https://www.study-in-germany.com
    max_pages: 30
    allow:
      - /en/plan-your-studies/requirements/
      - /en/plan-your-studies/preparation/
      - /en/plan-your-studies/plan-your-stay/
      - /en/germany/everyday-life/
      - /en/germany/career/after-university
    deny:
      - /community/             # student blog posts, not official information
      - /student-hall
      - /higher-education-compass
      - hec-fetch-offset        # disallowed in robots.txt
      - .pdf
    seeds:
      - { url: https://www.study-in-germany.com/en/germany/everyday-life/work, lang: en, topic: student-work }
      - { url: https://www.study-in-germany.com/en/plan-your-studies/requirements/visa, lang: en, topic: residence-permit }
      - { url: https://www.study-in-germany.com/en/plan-your-studies/requirements/proof-of-financing, lang: en, topic: residence-permit }
      - { url: https://www.study-in-germany.com/de/studium-planen/voraussetzungen/finanzierungsnachweis, lang: de, topic: residence-permit }
      - { url: https://www.study-in-germany.com/en/plan-your-studies/requirements/health-insurance, lang: en, topic: health-insurance }
      - { url: https://www.study-in-germany.com/en/plan-your-studies/requirements/language-skills, lang: en, topic: german-language }
      - { url: https://www.study-in-germany.com/en/plan-your-studies/preparation/enrolment, lang: en, topic: studying }
      - { url: https://www.study-in-germany.com/en/plan-your-studies/preparation/funding, lang: en, topic: studying }
      - { url: https://www.study-in-germany.com/en/plan-your-studies/preparation/accommodation, lang: en, topic: studying }
      - { url: https://www.study-in-germany.com/en/plan-your-studies/plan-your-stay/types-of-stay, lang: en, topic: residence-permit }
      - { url: https://www.study-in-germany.com/en/germany/career/after-university, lang: en, topic: after-graduation }

