# BriefKlar seed sources (MVP: 3 official sites).
#
# How the crawler uses this file:
#   1. It fetches every seed URL below.
#   2. It also fetches the page's <link rel="alternate" hreflang="de|en"> twin, if the site has one
#      (any path on the same site, as long as it is not denied).
#   3. It follows links on a seed page ONE level deep, but only to URLs that start with one of
#      the site's `allow` prefixes and do not contain any `deny` pattern.
#   4. It stops at `max_pages` per site.
# Run `python -m app.ingest.crawl --list` to print the final URL list without storing anything.

user_agent: "BriefKlarBot/0.1 (student project; +https://github.com/Harry24x/briefklar)"
delay_seconds: 1.0        # 1 request per second, per the plan
follow_depth: 1

sites:
  - name: make-it-in-germany
    base: https://www.make-it-in-germany.com
    max_pages: 30
    allow:
      - /en/study-vocational-training/studying-in-germany
      - /en/staying-in-germany-after-studies
      - /en/visa-recognition/visa-types/studying
      - /en/visa-recognition/visa-types/other/internship
      - /en/visa-recognition/opportunity-card/job-search
      - /en/arriving-living/getting-started
    deny:
      - /newsletter/            # old newsletters state outdated rules (e.g. 120 days instead of 140)
      - /job-listings
      - /glossary
      - .pdf
    seeds:
      - { url: https://www.make-it-in-germany.com/en/study-vocational-training/studying-in-germany, lang: en, topic: studying }
      - { url: https://www.make-it-in-germany.com/en/study-vocational-training/studying-in-germany/requirements, lang: en, topic: studying }
      - { url: https://www.make-it-in-germany.com/en/study-vocational-training/studying-in-germany/planning, lang: en, topic: studying }
      - { url: https://www.make-it-in-germany.com/en/study-vocational-training/studying-in-germany/work, lang: en, topic: student-work }
      - { url: https://www.make-it-in-germany.com/en/staying-in-germany-after-studies, lang: en, topic: after-graduation }
      - { url: https://www.make-it-in-germany.com/en/visa-recognition/visa-types/studying, lang: en, topic: residence-permit }
      - { url: https://www.make-it-in-germany.com/en/visa-recognition/visa-types/other/internship, lang: en, topic: residence-permit }
      - { url: https://www.make-it-in-germany.com/en/visa-recognition/apply-for-visa, lang: en, topic: residence-permit }
      - { url: https://www.make-it-in-germany.com/en/visa-recognition/opportunity-card/job-search, lang: en, topic: after-graduation }
      - { url: https://www.make-it-in-germany.com/en/arriving-living/getting-started/health-insurance, lang: en, topic: health-insurance }
      - { url: https://www.make-it-in-germany.com/en/advice-support/faq, lang: en, topic: faq }
      - { url: https://www.make-it-in-germany.com/de/service/faq, lang: de, topic: faq }

