[project]
name = "briefklar-backend"
version = "0.1.0"
description = "BriefKlar: explains German official letters with cited official sources"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "pyyaml>=6.0",
    "langdetect>=1.0.9",
    "openai>=1.40",
    "ics>=0.7,<0.8",
    "langgraph>=0.2",
]

[project.optional-dependencies]
# Local embedding + re-ranker models. Pulls in PyTorch, so it is kept out of the CI install.
ml = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["sql/*.sql", "ingest/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Behaviour of str\\(Component\\):FutureWarning",
    "ignore::urllib3.exceptions.DependencyWarning",
]
